apiVersion: batch/v1
kind: Job
metadata:
  name: management-demo-workspace-seed
  namespace: management
  labels:
    app: management-demo-workspace-seed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: management-demo-workspace-seed
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: 183548421506.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-service@sha256:132cbc945004812ae3367c21a3408da8f3c9ab1a01b5870ffdea1157c83f5d0a
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "entrypoints.demo_workspace"]
          args: ["seed", "--owner-user-id", "$(DEMO_WORKSPACE_OWNER_USER_ID)"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: management-runtime-secret
                  key: COMMAND_NOTIFY_DATABASE_URL
            - name: OPSIA_DEMO_WORKSPACE_MUTATIONS
              value: "demo-workspace-v1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: management-runtime-secret
                  key: GITHUB_TOKEN
                  optional: true
            - name: DEMO_WORKSPACE_OWNER_USER_ID
              value: ""
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: render-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: render-tmp
          emptyDir:
            sizeLimit: 64Mi
