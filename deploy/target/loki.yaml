# Grafana Loki Helm chart 값

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    allow_structured_metadata: true
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: http://minio.${TARGET_NAMESPACE}.svc:9000
      region: us-east-1
      accessKeyId: ${MINIO_ROOT_USER}
      secretAccessKey: ${MINIO_ROOT_PASSWORD}
      s3ForcePathStyle: true
      insecure: true
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: TARGET_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: MINIO_ROOT_USER
      valueFrom:
        secretKeyRef:
          name: minio-secret
          key: MINIO_ROOT_USER
    - name: MINIO_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: minio-secret
          key: MINIO_ROOT_PASSWORD

# kind/local 대상 클러스터는 작게 구성. Loki chart는 기본으로
# memcached result/chunk cache 활성화, chunk cache request는 약 9.8Gi
# production 설치에서는 cache size 조정 또는 재활성화
chunksCache:
  enabled: false

resultsCache:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
