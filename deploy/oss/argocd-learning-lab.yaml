  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: sync-waves
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo-waves
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
