apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-api-proxy-config
  namespace: management
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        client_max_body_size 2m;

        # 기계 클라이언트 전용 경로만 공개하고 콘솔·관리 API는 노출하지 않는다.
        location = /api/healthz {
            proxy_pass http://api-gateway.management.svc.cluster.local:8000/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /api/agent/ {
            proxy_pass http://api-gateway.management.svc.cluster.local:8000/agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
        }

        location ^~ /api/install/ {
            proxy_pass http://api-gateway.management.svc.cluster.local:8000/install/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # target Alertmanager의 인증된 장애 알림만 관리 API로 전달한다.
        # 콘솔 전체 API를 열지 않고 에이전트 등록 토큰 검증 단일 경로만 공개한다.
        location = /api/webhooks/alertmanager {
            proxy_pass http://api-gateway.management.svc.cluster.local:8000/webhooks/alertmanager;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # target agent의 bounded live summary WebSocket만 외부에 공개한다.
        location = /live/agent {
            proxy_pass http://realtime-gateway.management.svc.cluster.local:8000/live/agent;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api-proxy
  namespace: management
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: agent-api-proxy
  template:
    metadata:
      labels:
        app: agent-api-proxy
    spec:
      priorityClassName: gitops-control-critical
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: agent-api-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agent-api-proxy-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-api-proxy
  namespace: management
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agent-api-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api-proxy
  namespace: management
spec:
  type: ClusterIP
  selector:
    app: agent-api-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
