apiVersion: batch/v1
kind: Job
metadata:
  name: target-policy-upgrade
  namespace: management
  labels:
    app: target-policy-upgrade
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: target-policy-upgrade
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upgrade
          image: 183548421506.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-service@sha256:132cbc945004812ae3367c21a3408da8f3c9ab1a01b5870ffdea1157c83f5d0a
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "domains.target.policy_upgrade"]
          args: ["--apply"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: management-runtime-secret
                  key: COMMAND_NOTIFY_DATABASE_URL
            - name: TARGET_AGENT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: management-runtime-config
                  key: TARGET_AGENT_IMAGE
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
