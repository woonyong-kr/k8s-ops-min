---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 07-multi-source-helm
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: multi-source
spec:
  project: learning-lab
  sources:
    - repoURL: https://github.com/argoproj/argocd-example-apps.git
      targetRevision: HEAD
      path: helm-guestbook
      helm:
        releaseName: learning-multi-source
        valueFiles:
          - $values/helm-guestbook/values-production.yaml
    - repoURL: https://github.com/argoproj/argocd-example-apps.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo-multi-source
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 08-list-generator
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: applicationset
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - environment: dev
            path: lightweight/app-a
          - environment: stage
            path: lightweight/app-b
  template:
    metadata:
      name: '08-appset-{{.environment}}'
      labels:
        learning.opsia.dev/lab: argocd
        learning.opsia.dev/environment: '{{.environment}}'
    spec:
      project: learning-lab
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'argocd-demo-appset-{{.environment}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 09-git-directory-generator
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: git-generator
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        revision: HEAD
        directories:
          - path: lightweight/app-*
  template:
    metadata:
      name: '09-git-{{.path.basename}}'
      labels:
        learning.opsia.dev/lab: argocd
        learning.opsia.dev/topic: git-generator-child
    spec:
      project: learning-lab
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'argocd-demo-git-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
