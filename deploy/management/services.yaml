# realtime-gateway — cluster-agent live stream 수신 + browser WebSocket fan-out.
# node-collector 는 연결하지 않음(/metrics 는 Prometheus scrape 경로 유지).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: management
spec:
  replicas: 1
  # 무중단 교체 — 기존 pod 를 유지한 채 새 pod 가 ready 된 뒤에만 종료한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: realtime-gateway
  template:
    metadata:
      labels:
        app: realtime-gateway
    spec:
      priorityClassName: gitops-control-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-service@sha256:132cbc945004812ae3367c21a3408da8f3c9ab1a01b5870ffdea1157c83f5d0a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          command: ["python", "src/services/realtime/realtime-gateway/app.py"]
          envFrom:
            - configMapRef:
                name: management-runtime-config
            - secretRef:
                name: management-runtime-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-gateway
  namespace: management
spec:
  type: ClusterIP
  selector:
    app: realtime-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
