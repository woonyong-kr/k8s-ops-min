scenarios:
  - scenario_id: "secret.missing"
    version: 1
    title: "Secret 참조 누락"
    description: "존재하지 않는 sandbox Secret을 참조해 CreateContainerConfigError를 재현합니다."
    execution: "real"
    availability: "detector_gap"
    availability_reason: "CreateContainerConfigError/FailedMount를 Secret not found symptom으로 여는 감지 규칙이 없습니다."
    detector_work_needed:
      - "Pod waiting reason과 FailedMount event의 Secret symptom derivation"
      - "Secret 이름/namespace 안전 요약 수집"
    expected:
      root_cause: "missing_secret_reference"
      symptom: "Secret not found"
    evidence_sources: ["kubernetes", "logs", "metadata"]
    safety: &sandbox_safety
      namespace: "sandbox"
      cleanup_required: true
      ttl_seconds: 300
      management_cluster_allowed: false
      resource_name_prefix: "rca-test-"
      max_concurrent_runs: 1
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-secret-missing"
        fault_mode: "missing_secret"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 90
      poll_seconds: 2
      pod_waiting_reasons: ["CreateContainerConfigError"]
      event_reasons: ["FailedMount"]
      event_message_any: ["secret", "not found"]
    cleanup: &manifest_delete_cleanup
      adapter: "kubernetes.manifest_delete"
      params: {propagation_policy: "Foreground"}

  - scenario_id: "secret.key-missing"
    version: 1
    title: "Secret key 누락"
    description: "존재하는 테스트 Secret에서 없는 key를 참조해 컨테이너 설정 실패를 재현합니다."
    execution: "real"
    availability: "detector_gap"
    availability_reason: "Secret 객체 누락과 key 누락을 분리하는 이벤트 신호 평가가 아직 없습니다."
    detector_work_needed:
      - "couldn't find key 이벤트 패턴 수집"
      - "Secret 존재 여부와 key 참조의 안전한 비교"
    expected:
      root_cause: "secret_key_missing"
      symptom: "Secret not found"
    evidence_sources: ["kubernetes", "logs", "metadata"]
    safety: *sandbox_safety
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-secret-key-missing"
        fault_mode: "missing_secret_key"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 90
      poll_seconds: 2
      pod_waiting_reasons: ["CreateContainerConfigError"]
      event_message_any: ["couldn't find key", "secret"]
    cleanup: *manifest_delete_cleanup
