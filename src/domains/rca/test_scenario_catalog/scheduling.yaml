scenarios:
  - scenario_id: "schedule.cpu"
    version: 1
    title: "CPU 부족 스케줄링 실패"
    description: "클러스터보다 큰 CPU request를 가진 테스트 Pod로 FailedScheduling을 만듭니다."
    execution: "real"
    availability: "detector_gap"
    availability_reason: "현재 시나리오는 Kubernetes evidence만 요청하지만 insufficient_cpu 후보는 실제 metrics evidence도 요구하므로 RCA가 blocked됩니다. run-scoped Prometheus 계약 검증 전에는 READY가 아닙니다."
    detector_work_needed:
      - "test Pod CPU request와 node allocatable을 조회하는 run-scoped PromQL"
      - "빈 Prometheus 결과를 근거로 승격하지 않는 수집 완료 조건"
      - "insufficient_cpu까지 evidence → RCA completed E2E 검증"
    expected:
      root_cause: "insufficient_cpu"
      symptom: "FailedScheduling"
    evidence_sources: ["kubernetes"]
    safety: &sandbox_safety
      namespace: "sandbox"
      cleanup_required: true
      ttl_seconds: 300
      management_cluster_allowed: false
      resource_name_prefix: "rca-test-"
      max_concurrent_runs: 1
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-schedule-cpu"
        fault_mode: "insufficient_cpu"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 90
      poll_seconds: 2
      event_reasons: ["FailedScheduling"]
      event_message_any: ["Insufficient cpu"]
    cleanup: &manifest_delete_cleanup
      adapter: "kubernetes.manifest_delete"
      params: {propagation_policy: "Foreground"}

  - scenario_id: "schedule.memory"
    version: 1
