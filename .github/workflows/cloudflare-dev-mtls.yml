name: Cloudflare Dev Tunnel and mTLS

# console-dev is the canonical in-cluster console Service until a coordinated
# DNS -> Tunnel -> ingress -> Service migration renames every reference.

run-name: Cloudflare dev mTLS / ${{ inputs.dry_run && 'dry-run' || 'apply' }}

"on":
  workflow_dispatch:
    inputs:
      origin_service:
        description: Canonical console-dev origin; override only during a coordinated rename.
        required: false
        default: http://console-dev.management.svc.cluster.local:80
        type: string
      csr_batch_b64:
        description: Base64 JSON array containing exactly five name/csr objects.
        required: true
        type: string
      certificate_validity_days:
        description: Cloudflare-managed client certificate lifetime (1-3650 days).
        required: false
        default: "365"
        type: string
      dry_run:
        description: Run all read preflights and print the plan without changing Cloudflare.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-dev-k8s-mtls
  cancel-in-progress: false

jobs:
  configure:
    name: Configure dev Tunnel, DNS, and mTLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Mask Cloudflare and CSR inputs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_CSR_BATCH_B64: ${{ inputs.csr_batch_b64 }}
        run: |
          printf '::add-mask::%s\n' "$CLOUDFLARE_API_TOKEN"
          printf '::add-mask::%s\n' "$CLOUDFLARE_ACCOUNT_ID"
          printf '::add-mask::%s\n' "$CLOUDFLARE_ZONE_ID"
          printf '::add-mask::%s\n' "$CLOUDFLARE_TUNNEL_ID"
          printf '::add-mask::%s\n' "$CLOUDFLARE_CSR_BATCH_B64"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Configure Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_CSR_BATCH_B64: ${{ inputs.csr_batch_b64 }}
          ORIGIN_SERVICE: ${{ inputs.origin_service }}
          CERTIFICATE_VALIDITY_DAYS: ${{ inputs.certificate_validity_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python scripts/cloudflare/configure_dev_mtls.py \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --zone-id "$CLOUDFLARE_ZONE_ID" \
            --tunnel-id "$CLOUDFLARE_TUNNEL_ID" \
            --origin-service "$ORIGIN_SERVICE" \
            --validity-days "$CERTIFICATE_VALIDITY_DAYS" \
            --dry-run "$DRY_RUN" \
            --output-dir artifacts/cloudflare-client-certificates

      - name: Upload signed public client certificates
        if: ${{ success() && inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dev-client-certificates-${{ github.run_id }}
          path: artifacts/cloudflare-client-certificates
          if-no-files-found: error
          retention-days: 7
