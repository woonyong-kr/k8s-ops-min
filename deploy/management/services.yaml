apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: management
spec:
  replicas: 2
  # 무중단 교체 — 기존 pod 를 유지한 채 새 pod 가 ready 된 뒤에만 종료한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      priorityClassName: gitops-control-critical
      serviceAccountName: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-service@sha256:132cbc945004812ae3367c21a3408da8f3c9ab1a01b5870ffdea1157c83f5d0a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
          command: ["python", "src/services/gateway/api-gateway/app.py"]
          envFrom:
            - configMapRef:
                name: management-runtime-config
            - secretRef:
                name: management-runtime-secret
          env:
            # 게이트웨이는 세션 API + agent 롱폴이 겹치는 최대 동시성 지점 —
            # pgbouncer(transaction pooling)가 서버 커넥션을 다중화하므로
            # 클라이언트 풀을 넉넉히 잡아 폴 대기가 API 요청을 굶기지 않게 한다.
            - name: DB_POOL_SIZE
              value: "128"
            - name: DB_MAX_OVERFLOW
              value: "128"
            - name: DB_POOL_TIMEOUT_SECONDS
              value: "30"
            # 인벤토리 스냅샷 적재는 클러스터별 어드바이저리 락을 트랜잭션 내내 잡는다.
            # 데이터가 큰 클러스터 쓰기가 길어질 때 동시 적재가 5초 기본 한도에서
            # LockNotAvailable(500)로 죽지 않도록 락 대기 한도를 20초로 넓힌다
            # (statement_timeout 30초 이내).
            - name: DB_LOCK_TIMEOUT_MS
              value: "20000"
            # 라이브 릴리스 게이트 — 승인 후 실제 GitOps dispatch/apply 허용.
            # allowlist 는 default 워크스페이스만(그 외 워크스페이스는 여전히 차단).
            - name: RELEASE_FLOW_LIVE_ENABLED
              value: "1"
            - name: RELEASE_FLOW_LIVE_WORKSPACES
              value: "default"
            # dev도 실제 세션 인증을 사용한다. 배포 검증기가 누락·비정상 값을 차단한다.
            - name: DEV_AUTH_BYPASS
              value: "0"
            - name: CONSOLE_ORIGIN
              value: "http://console-dev.management.svc.cluster.local:80"
            - name: PUBLIC_BASE_URL
              value: "https://k8s.woonyong.org"
            # 반복 JSON/DB 처리 후 RSS 를 덜 붙잡게 해 OOM 여유를 확보한다.
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "65536"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: management
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: http-default
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: management
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
    spec:
      priorityClassName: gitops-control-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-service@sha256:132cbc945004812ae3367c21a3408da8f3c9ab1a01b5870ffdea1157c83f5d0a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          command: ["python", "src/services/gateway/outbox-relay/app.py"]
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<30 else 1)"
            initialDelaySeconds: 240
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          envFrom:
            - configMapRef:
                name: management-runtime-config
            - secretRef:
                name: management-runtime-secret
          env:
            # 전용 relay 는 모든 source row 를 lease/skip-locked 로 처리한다.
            # 워커 내장 relay 와 동시에 돌아도 같은 outbox row lease 가 중복 발행을 막는다.
            - name: OUTBOX_RELAY_SOURCE
              value: "*"
            - name: OUTBOX_RELAY_BATCH
              value: "10"
            - name: OUTBOX_RELAY_INTERVAL_SECONDS
              value: "1"
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "65536"
