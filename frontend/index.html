<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let storedTheme = null;
        let locale = navigator.language?.toLowerCase().startsWith("ko") ? "ko" : "en";
        try {
          storedTheme = window.localStorage.getItem("opsia-theme");
          const storedLocale = window.localStorage.getItem("opsia.locale");
          if (storedLocale === "en" || storedLocale === "ko") locale = storedLocale;
        } catch {
          storedTheme = null;
        }
        const selectedTheme = storedTheme === "dark" || storedTheme === "light"
          ? storedTheme
          : storedTheme === "system"
            ? storedTheme
            : "system";
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        const isDark = selectedTheme === "dark" || (selectedTheme === "system" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document.documentElement.lang = locale;
      })();
    </script>
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
      }
      :root.dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
      }
      html,
      body,
      #root {
        min-height: 100%;
        color: var(--foreground);
        background: var(--background);
      }
      body {
        margin: 0;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kyro — provider-neutral Kubernetes operations and GitOps control plane."
    />
    <meta name="application-name" content="Kyro" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Kyro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
