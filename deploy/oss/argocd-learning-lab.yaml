apiVersion: v1
kind: Secret
metadata:
  name: argocd-example-apps
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    learning.opsia.dev/purpose: public-demo-repository
type: Opaque
stringData:
  name: argocd-example-apps
  project: learning-lab
  type: git
  url: https://github.com/argoproj/argocd-example-apps.git
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: learning-lab
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
spec:
  description: Safe Argo CD learning lab backed by the official public example repository
  sourceRepos:
    - https://github.com/argoproj/argocd-example-apps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd-demo-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: viewer
      description: Example project-scoped read-only role
      policies:
        - p, proj:learning-lab:viewer, applications, get, learning-lab/*, allow
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      duration: 1h
      applications:
        - "*"
      manualSync: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-manual-plain-yaml
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: manual-sync
spec:
  project: learning-lab
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo-manual
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 02-auto-helm
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: helm
spec:
  project: learning-lab
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: helm-guestbook
    helm:
      releaseName: learning-helm
      valueFiles:
        - values-production.yaml
      parameters:
        - name: service.type
          value: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo-helm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 03-auto-kustomize
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: kustomize
spec:
  project: learning-lab
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: kustomize-guestbook
    kustomize:
      namePrefix: learning-
      commonLabels:
        learning.opsia.dev/managed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo-kustomize
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 04-auto-jsonnet
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: jsonnet
spec:
  project: learning-lab
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: jsonnet-guestbook
    directory:
      jsonnet:
        extVars:
          - name: service
            value: learning-jsonnet
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo-jsonnet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 05-pre-post-hooks
  namespace: argocd
  labels:
    learning.opsia.dev/lab: argocd
    learning.opsia.dev/topic: hooks
spec:
  project: learning-lab
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
